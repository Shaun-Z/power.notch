name: Build for macOS

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

# https://stackoverflow.com/a/72408109/6942800
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege: only needs to read code for building.
permissions:
  contents: read

jobs:
  build:
    name: Build powerNotch
    strategy:
      matrix:
        platform:
          - macOS
        xcode:
          - '26.6'
        scheme:
          - powerNotch
    # Match the shared release build's toolchain, including native macOS 26 APIs.
    runs-on: macos-latest
    steps:
    - name: Code Checkout
      # TODO: pin to immutable SHA
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: AI usage regression tests
      env:
        DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      run: swift test
    - # TODO: pin to immutable SHA
      uses: mxcl/xcodebuild@d3ee9b419c1be9a988086c58fe0988f32d99cfc5 # v3.6.0
      with:
        xcode: ${{ matrix.xcode }}
        platform: ${{ matrix.platform }}
        scheme: ${{ matrix.scheme }}
        action: build
        verbosity: xcpretty
        upload-logs: always
        configuration: release
