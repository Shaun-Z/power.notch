name: "Reusable Build"
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: false
        type: string
      build_number:
        required: true
        type: string
      xcode_version:
        required: false
        type: string
        default: "26.6"
      update_channel:
        required: false
        type: string
        default: "stable"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      PROJECT_NAME: powerNotch
      APP_NAME: powerNotch
      VERSION_INPUT: ${{ inputs.version }}
      BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
      UPDATE_CHANNEL: ${{ inputs.update_channel }}
      XCODE_VERSION: ${{ inputs.xcode_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Set up Python for signing and DMG tools
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"
          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Xcode ${XCODE_VERSION} not found at ${XCODE_PATH}"
            echo "Available Xcode versions:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none found)"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT_NAME.xcodeproj" -onlyUsePackageVersionsFromResolvedFile

      - name: Release pipeline regression tests
        run: python3 -m unittest discover -s .github/scripts/tests -v

      - name: Set version and build number
        run: |
          set -euo pipefail
          PBXPROJ="$PROJECT_NAME.xcodeproj/project.pbxproj"
          VERSION="$VERSION_INPUT"
          if [[ -z "$BUILD_NUMBER_INPUT" ]]; then
            echo "::error::A build number must be provided by the caller"
            exit 1
          fi
          BUILD_NUMBER="$BUILD_NUMBER_INPUT"
          python3 .github/scripts/stamp_version.py \
            --pbxproj "$PBXPROJ" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --info-plist "$PROJECT_NAME/Info.plist" \
            --update-channel "$UPDATE_CHANNEL"

      - name: Archive without an Apple certificate
        run: |
          set -euo pipefail
          xcodebuild clean archive \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$PROJECT_NAME" \
            -archivePath "$RUNNER_TEMP/$PROJECT_NAME.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            -destination "generic/platform=macOS" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            REGISTER_APP_GROUPS=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64"

      - name: Stage and ad-hoc sign app
        run: |
          set -euo pipefail
          mkdir -p Release
          ditto "$RUNNER_TEMP/$PROJECT_NAME.xcarchive/Products/Applications/$APP_NAME.app" "Release/$APP_NAME.app"
          python3 .github/scripts/sign_adhoc.py "Release/$APP_NAME.app"
          lipo "Release/$APP_NAME.app/Contents/MacOS/$APP_NAME" -verify_arch arm64
          lipo "Release/$APP_NAME.app/Contents/MacOS/$APP_NAME" -verify_arch x86_64

      - name: Archive app preserving signatures and executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent "Release/$APP_NAME.app" "Release/$APP_NAME.app.zip"

      - name: Create DMG
        run: |
          VENV_DIR="$RUNNER_TEMP/venv"
          python3 -m venv "$VENV_DIR"
          source "$VENV_DIR/bin/activate"
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --require-hashes -r Configuration/dmg/requirements.txt
          chmod +x Configuration/dmg/create_dmg.sh
          ./Configuration/dmg/create_dmg.sh \
            "Release/$APP_NAME.app" \
            "Release/$PROJECT_NAME.dmg" \
            "$APP_NAME $VERSION_INPUT"
          hdiutil verify "Release/$PROJECT_NAME.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PROJECT_NAME }}.dmg
          path: Release/${{ env.PROJECT_NAME }}.dmg
          if-no-files-found: error

      - name: Upload .app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APP_NAME }}.app
          path: Release/${{ env.APP_NAME }}.app.zip
          if-no-files-found: error
